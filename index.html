<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能力训练账本</title>
  <meta name="description" content="一个纯静态的个人能力训练打卡网站，用于记录思考、表达与职场沟通的 12 周练习。">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --paper: #F1EEE4;
      --ink: #25211B;
      --muted: #5E574B;
      --line: #9B9386;
      --accent: #174D3A;
      --measure: 68ch;
      --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      font-variant-numeric: oldstyle-nums tabular-nums;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.6;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.18em;
    }

    ::selection {
      background: rgba(23, 77, 58, 0.18);
    }

    .loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
    }

    .app[hidden],
    .loading[hidden] {
      display: none;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 30px;
    }

    .site-header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
      margin-bottom: 42px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
    }

    .kicker,
    .label,
    .nav-link,
    .button,
    .smallcaps {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .kicker,
    .label,
    .fineprint,
    .muted {
      color: var(--muted);
    }

    .site-title {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      line-height: 0.95;
      font-weight: 600;
      letter-spacing: 0;
    }

    .site-subtitle {
      max-width: 44rem;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .nav {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      margin-top: 28px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 1px;
      border: 0;
      border-top: 2px solid transparent;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link.active {
      color: var(--accent);
      border-top-color: var(--accent);
      outline: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 56px;
      align-items: start;
    }

    .main {
      min-width: 0;
    }

    .margin-notes {
      position: sticky;
      top: 24px;
      border-left: 1px solid var(--line);
      padding-left: 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .margin-note + .margin-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .margin-note p {
      margin: 6px 0 0;
    }

    .section-head {
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .section-head h2 {
      margin: 0;
      max-width: var(--measure);
      font-size: clamp(2rem, 5vw, 3.55rem);
      line-height: 1.02;
      font-weight: 600;
      letter-spacing: 0;
    }

    .section-head p {
      max-width: var(--measure);
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1.06rem;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 14px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .ledger-panel,
    .ledger-list,
    .template-item,
    .plan-week,
    .settings-panel {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }

    .ledger-panel + .ledger-panel,
    .ledger-list + .ledger-panel,
    .template-item + .template-item,
    .plan-week + .plan-week,
    .settings-panel + .settings-panel {
      margin-top: 28px;
    }

    .week-brief {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    .brief-cell {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .brief-cell strong {
      display: block;
      margin-top: 7px;
      font-size: 1.12rem;
      font-weight: 500;
    }

    .metric-strip,
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin: 28px 0;
    }

    .stats-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .metric {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .metric-value {
      display: block;
      margin-top: 5px;
      color: var(--ink);
      font-size: 2rem;
      line-height: 1;
      font-weight: 600;
    }

    .metric-value.good {
      color: var(--accent);
    }

    .segments {
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      margin: 22px 0 28px;
    }

    .segment-button {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      min-height: 72px;
      padding: 14px 16px;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .segment-button:hover,
    .segment-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .box {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--ink);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 1rem;
      line-height: 1;
    }

    .segment-button[aria-pressed="true"] .box::before,
    .checkmark.done::before {
      content: "X";
    }

    .segment-title {
      display: block;
      font-size: 1.18rem;
      line-height: 1.18;
      font-weight: 500;
    }

    .segment-desc {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .segment-code {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 24px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
    }

    textarea,
    input[type="date"],
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(241, 238, 228, 0.72);
      color: var(--ink);
      border-radius: 0;
    }

    textarea {
      min-height: 168px;
      resize: vertical;
      padding: 14px 15px;
      line-height: 1.58;
    }

    input[type="date"] {
      min-height: 42px;
      padding: 8px 10px;
      font-family: var(--mono);
      color: var(--ink);
    }

    textarea:focus-visible,
    input:focus-visible,
    .button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 0;
      cursor: pointer;
      text-decoration: none;
    }

    .button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }

    .button.danger {
      border-color: var(--ink);
    }

    .week-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .week-title {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.2;
      font-weight: 500;
    }

    .table-wrap {
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      color: var(--ink);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 11px 10px;
      vertical-align: middle;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .today-row td:first-child {
      border-left: 3px solid var(--accent);
      padding-left: 7px;
    }

    .checkmark {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid var(--line);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.78rem;
    }

    .reflection-cell {
      max-width: 230px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phase-block + .phase-block {
      margin-top: 42px;
    }

    .phase-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 1.22rem;
      font-weight: 600;
    }

    .phase-title::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--line);
    }

    .plan-week {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 20px;
    }

    .plan-week.current {
      border-top-color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .week-number {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.86rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
    }

    .plan-week h4,
    .template-item h3,
    .settings-panel h3 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      line-height: 1.25;
      font-weight: 500;
    }

    .definition-list {
      display: grid;
      gap: 7px;
      margin: 12px 0 0;
    }

    .definition-list div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 12px;
    }

    .definition-list dt {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.76rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.07em;
    }

    .definition-list dd {
      margin: 0;
    }

    .template-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .template-body {
      margin: 0;
      max-width: var(--measure);
      white-space: pre-wrap;
      color: var(--ink);
    }

    .template-body.code {
      border-left: 1px solid var(--line);
      padding-left: 16px;
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
    }

    .heatmap-shell {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
      overflow-x: auto;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(12, minmax(28px, 1fr));
      gap: 8px;
      min-width: 520px;
    }

    .heat-week {
      display: grid;
      grid-template-rows: repeat(7, 20px);
      gap: 6px;
    }

    .heat-cell {
      border: 1px solid var(--line);
      background-color: rgba(23, 77, 58, var(--heat));
      position: relative;
    }

    .heat-cell.today {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .heat-cell.before-start::after {
      content: "";
      position: absolute;
      inset: 45% 18%;
      border-top: 1px solid rgba(94, 87, 75, 0.62);
    }

    .reflection-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .reflection-list li {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .reflection-date {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(220px, 0.6fr) minmax(0, 1fr);
      gap: 18px;
      align-items: end;
    }

    .notice {
      border-left: 2px solid var(--accent);
      padding: 9px 0 9px 14px;
      color: var(--muted);
      margin: 18px 0;
    }

    .site-footer {
      margin-top: 62px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .margin-notes {
        position: static;
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 18px 0 0;
      }

      .week-brief,
      .metric-strip,
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .app {
        width: min(100% - 24px, 1120px);
        padding-top: 28px;
      }

      .masthead,
      .week-brief,
      .spine-thesis,
      .spine-flow,
      .spine-prompts,
      .metric-strip,
      .stats-grid,
      .field-grid,
      .settings-grid {
        grid-template-columns: 1fr;
      }

      .site-title {
        font-size: clamp(2rem, 14vw, 3.5rem);
      }

      .site-subtitle {
        font-size: 1rem;
      }

      .nav {
        gap: 16px;
      }

      .section-head h2 {
        font-size: clamp(1.9rem, 12vw, 3rem);
      }

      .segment-button {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .segment-code {
        grid-column: 2;
      }

      .plan-week,
      .reflection-list li,
      .definition-list div {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

      function pad(number) {

        return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0, 0);

        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function keyToDate(key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(key))) return null;
        const [year, month, day] = key.split("-").map(Number);
        const date = new Date(year, month - 1, day, 12, 0, 0, 0);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;

        const a = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());

      }

      function formatShortDate(date) {
        return new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit" }).format(date);
      }

      function weekday(date) {
        return new Intl.DateTimeFormat("zh-CN", { weekday: "long" }).format(date);
      }

      function dayStorageKey(key) {
        return `${DAY_PREFIX}${key}`;
      }

      function canUseLocalStorage() {
        try {
          const probe = `${APP}:probe`;
          window.localStorage.setItem(probe, "1");
          window.localStorage.removeItem(probe);
          state.storageMode = "localStorage";
          return true;
        } catch (error) {
          state.storageMode = "memory";
          return false;
        }
      }

      let localStorageOK = canUseLocalStorage();

      function readRaw(key) {
        if (localStorageOK) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
      }

      function writeRaw(key, value) {
        if (localStorageOK) {
          try {
            window.localStorage.setItem(key, value);
            return;
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        memoryStore[key] = value;
      }

      function removeRaw(key) {
        if (localStorageOK) {
          try {
            window.localStorage.removeItem(key);
            return;
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        delete memoryStore[key];
      }

      function listStorageKeys() {
        if (localStorageOK) {
          try {
            const keys = [];
            for (let index = 0; index < window.localStorage.length; index += 1) {
              const key = window.localStorage.key(index);
              if (key) keys.push(key);
            }
            return keys;
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        return Object.keys(memoryStore);
      }

      function parseJSON(raw) {
        try {
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
        }
      }

      function defaultSegments() {
        return SEGMENTS.reduce((acc, segment) => {
          acc[segment.id] = false;
          return acc;
        }, {});
      }

      function normalizeDay(value) {
        const source = value && typeof value === "object" ? value : {};
        const incomingSeg = source.seg && typeof source.seg === "object" ? source.seg : {};
        return {
          seg: SEGMENTS.reduce((acc, segment) => {
            acc[segment.id] = Boolean(incomingSeg[segment.id]);
            return acc;
          }, {}),
          note: typeof source.note === "string" ? source.note : "",
          reflection: typeof source.reflection === "string" ? source.reflection : "",
          updatedAt: typeof source.updatedAt === "string" ? source.updatedAt : ""
        };
      }

      function getDay(key) {
        return normalizeDay(parseJSON(readRaw(dayStorageKey(key))));
      }

      function saveDay(key, day) {
        const normalized = normalizeDay(day);
        normalized.updatedAt = new Date().toISOString();
        writeRaw(dayStorageKey(key), JSON.stringify(normalized));
      }

      function loadMeta() {
        const parsed = parseJSON(readRaw(META_KEY));
        const start = parsed && keyToDate(parsed.start) ? parsed.start : dateToKey(today());
        const meta = { start };
        if (!parsed || parsed.start !== start) saveMeta(meta);
        return meta;
      }

      function saveMeta(meta) {
        writeRaw(META_KEY, JSON.stringify({ start: meta.start }));
      }

      function allDayKeys() {
        return Array.from(new Set(
          listStorageKeys()
            .filter((key) => key.startsWith(DAY_PREFIX))
            .map((key) => key.slice(DAY_PREFIX.length))
            .filter((key) => keyToDate(key))
        )).sort();
      }

      function completionCount(day) {
        return SEGMENTS.reduce((count, segment) => count + (day.seg[segment.id] ? 1 : 0), 0);
      }

      function isQualified(day) {
        return completionCount(day) >= 4;
      }

      function startDate() {
        return keyToDate(state.meta.start) || today();
      }

      function currentWeekNumber(date = today()) {
        return Math.floor(diffDays(startDate(), date) / 7) + 1;
      }

      function planForWeek(weekNumber) {
        return WEEK_PLANS.find((plan) => plan.week === weekNumber) || null;
      }

      function todayPlan() {
        const weekNumber = currentWeekNumber();
        if (weekNumber < 1) {
          return {
            weekLabel: "未开始",
            title: "计划尚未开始",
            goal: "第 1 周开始日期还在未来。",
            daily: "先确认第 1 周开始日期，或提前做一次轻量输入与复盘。",
            review: "开始前只需把环境和节奏准备好。"
          };
        }
        if (weekNumber > 12) {
          return {
            weekLabel: `第 ${weekNumber} 周`,
            title: "12 周计划已完成",
            goal: "回看记录，选择下一季仍然薄弱的两项。",
            daily: "做一次完整“输入→输出→讲述”，或按最弱模块补练。",
            review: "写下下一季的训练起点。"
          };
        }
        const plan = planForWeek(weekNumber);
        return {
          weekLabel: `第 ${weekNumber} 周`,
          title: plan.title,
          goal: plan.goal,
          daily: plan.daily,
          review: plan.review
        };
      }

      function currentStreak() {
        let cursor = today();
        if (!isQualified(getDay(dateToKey(cursor)))) {
          cursor = addDays(cursor, -1);
        }
        let streak = 0;
        for (let guard = 0; guard < 3650; guard += 1) {
          if (!isQualified(getDay(dateToKey(cursor)))) break;
          streak += 1;
          cursor = addDays(cursor, -1);
        }
        return streak;
      }

      function progressStats() {
        const begin = startDate();
        const now = today();
        const rawDays = diffDays(begin, now) + 1;
        const visibleDays = Math.max(0, rawDays);
        const denominator = Math.max(1, rawDays);
        let qualified = 0;
        let longest = 0;
        let run = 0;
        for (let index = 0; index < visibleDays; index += 1) {
          const key = dateToKey(addDays(begin, index));
          if (isQualified(getDay(key))) {
            qualified += 1;
            run += 1;
            longest = Math.max(longest, run);
          } else {
            run = 0;
          }
        }
        return {
          startedDays: visibleDays,
          qualified,
          current: currentStreak(),
          longest,
          rate: Math.round((qualified / denominator) * 100)
        };
      }

      function weekStart(weekNumber) {
        return addDays(startDate(), (weekNumber - 1) * 7);
      }

      function routeFromHash() {
        const route = window.location.hash.replace("#", "");
        return ROUTES.includes(route) ? route : "today";
      }

      function setFlash(message) {
        state.flash = message;
        window.setTimeout(() => {
          if (state.flash === message) {
            state.flash = "";
            if (state.route === "progress") render();
          }
        }, 3200);
      }

      function render() {
        state.route = routeFromHash();
        const currentWeek = currentWeekNumber();
        if (!state.selectedWeek) state.selectedWeek = Math.max(1, currentWeek);

        document.getElementById("header-date").textContent = `${formatDate(today())} · ${weekday(today())}`;
        document.querySelectorAll(".nav-link").forEach((link) => {
          link.classList.toggle("active", link.dataset.route === state.route);
        });

        const view = document.getElementById("view");
        view.innerHTML = {
          today: renderToday,
          week: renderWeek,
          plan: renderPlan,
          templates: renderTemplates,
          progress: renderProgress
        }[state.route]();

        document.getElementById("margin-notes").innerHTML = renderMarginNotes();
        bindPageEvents();
      }

      function renderMarginNotes() {
        const plan = todayPlan();
        const stats = progressStats();
        const storageText = state.storageMode === "localStorage" ? "localStorage" : "内存临时存储";
        return `
          <div class="margin-note">
            <div class="label">Main Line</div>
            <p>小事 → 宏观 → 结构 → 判断 → 表达 → 共事。</p>
          </div>
          <div class="margin-note">
            <div class="label">Current Folio</div>
            <p>${escapeHtml(plan.weekLabel)} · ${escapeHtml(plan.title)}</p>
          </div>
          <div class="margin-note">
            <div class="label">Rule</div>
            <p>每日六段完成至少四段，即记为达标。</p>
          </div>
          <div class="margin-note">
            <div class="label">Continuity</div>
            <p>当前连续 ${stats.current} 天；最长连续 ${stats.longest} 天。</p>
          </div>
          <div class="margin-note">
            <div class="label">Storage</div>
            <p>${storageText} · 数据只留在本浏览器。</p>
          </div>
        `;
      }

      function renderTrainingSpine() {
        const steps = [
          ["01", "从日常小事出发"],
          ["02", "找到背后的宏观变化"],
          ["03", "追到中间结构"],
          ["04", "判断耦合与调整代价"],
          ["05", "压缩成英文判断"],
          ["06", "用好共事的方式沟通"]
        ];
        const prompts = [
          "今天这件小事，背后的社会变化是什么？",
          "宏观力量通过什么制度、平台、流程或关系影响到个人生活？",
          "这里是牵一发而动全身，还是只是可以改掉的噪音？",
          "我能不能把判断说清楚，并让同事觉得我肯学、靠谱、不难共事？"
        ];
        return `
          <section class="training-spine" aria-labelledby="training-spine-title">
            <div class="spine-thesis">
              <div class="label">Main Line</div>
              <div>
                <strong id="training-spine-title">不是来打卡，是练一条完整能力链：解释世界，吸收信息，表达判断，与人共事。</strong>
                <p>每天的六段训练都服务于同一件事：把小事背后的结构看清楚，把大量信息变成自己的判断，再用英语和职场语言说出来。</p>
              </div>
            </div>
            <div class="spine-flow" aria-label="训练主线六步">
              ${steps.map(([number, text]) => `
                <div class="spine-step">
                  <span>${number}</span>
                  <b>${escapeHtml(text)}</b>
                </div>
              `).join("")}
            </div>
            <div class="spine-prompts">
              ${prompts.map((prompt) => `<div class="spine-prompt">${escapeHtml(prompt)}</div>`).join("")}
            </div>
          </section>
        `;
      }

      function sectionHead(number, title, subtitle, meta = "") {
        return `
          <section class="section-head">
            <div class="kicker">§${number}</div>
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(subtitle)}</p>
            ${meta ? `<div class="meta-line">${meta}</div>` : ""}
          </section>
        `;
      }

      function renderToday() {
        const key = dateToKey(today());
        const day = getDay(key);
        const count = completionCount(day);
        const stats = progressStats();
        const plan = todayPlan();
        const completeText = count >= 4 ? "达标" : "未达标";
        const meta = `<span>${escapeHtml(formatDate(today()))}</span><span>${escapeHtml(weekday(today()))}</span><span>${escapeHtml(plan.weekLabel)}</span>`;
        return `
          ${sectionHead(1, "今天", "每日训练的单页账本。", meta)}
          ${renderTrainingSpine()}
          <div class="week-brief">
            <div class="brief-cell">
              <span class="label">Theme</span>
              <strong>${escapeHtml(plan.title)}</strong>
            </div>
            <div class="brief-cell">
              <span class="label">Goal</span>
              <strong>${escapeHtml(plan.goal)}</strong>
            </div>
            <div class="brief-cell">
              <span class="label">Today</span>
              <strong>${escapeHtml(plan.daily)}</strong>
            </div>
          </div>
          <div class="metric-strip" aria-label="今日统计">
            <div class="metric">
              <span class="label">Completed</span>
              <span class="metric-value">${count}/6</span>
            </div>
            <div class="metric">
              <span class="label">Streak</span>
              <span class="metric-value">${stats.current}</span>
            </div>
            <div class="metric">
              <span class="label">Status</span>
              <span class="metric-value ${count >= 4 ? "good" : ""}">${completeText}</span>
            </div>
          </div>
          <div class="ledger-panel">
            <div class="label">Daily Engine</div>
            <div class="segments">
              ${SEGMENTS.map((segment) => `
                <button class="segment-button" type="button" data-segment="${segment.id}" aria-pressed="${day.seg[segment.id] ? "true" : "false"}">
                  <span class="box" aria-hidden="true"></span>
                  <span>
                    <span class="segment-title">${escapeHtml(segment.zh)}</span>
                    <span class="segment-desc">${escapeHtml(segment.desc)}</span>
                  </span>
                  <span class="segment-code">${escapeHtml(segment.en)}</span>
                </button>
              `).join("")}
            </div>
          </div>
          <div class="field-grid">
            <div class="field">
              <label class="label" for="today-note">今日笔记</label>
              <textarea id="today-note" autocomplete="off">${escapeHtml(day.note)}</textarea>
            </div>
            <div class="field">
              <label class="label" for="today-reflection">一句反思</label>
              <textarea id="today-reflection" autocomplete="off">${escapeHtml(day.reflection)}</textarea>
            </div>
          </div>
        `;
      }

      function renderWeek() {
        const currentWeek = currentWeekNumber();
        const selected = Math.max(1, state.selectedWeek || Math.max(1, currentWeek));
        const start = weekStart(selected);
        const plan = planForWeek(selected);
        const days = Array.from({ length: 7 }, (_, index) => addDays(start, index));
        const qualifiedDays = days.reduce((sum, date) => sum + (isQualified(getDay(dateToKey(date))) ? 1 : 0), 0);
        const label = selected === currentWeek ? `第 ${selected} 周 · 当前周` : `第 ${selected} 周`;
        const review = plan ? plan.review : "计划周期外：沿用第 12 周复盘方式，整理下一季计划。";
        return `
          ${sectionHead(2, "本周", "七天训练账本的只读汇总。", `<span>${escapeHtml(label)}</span><span>${escapeHtml(formatShortDate(start))} - ${escapeHtml(formatShortDate(addDays(start, 6)))}</span>`)}
          <div class="week-controls">
            <h3 class="week-title">${escapeHtml(label)}</h3>
            <div class="button-row">
              <button class="button" type="button" data-week-action="prev">上一周</button>
              <button class="button primary" type="button" data-week-action="current">当前周</button>
              <button class="button" type="button" data-week-action="next">下一周</button>
            </div>
          </div>
          <div class="metric-strip">
            <div class="metric">
              <span class="label">Qualified Days</span>
              <span class="metric-value">${qualifiedDays}/7</span>
            </div>
            <div class="metric">
              <span class="label">Review</span>
              <span class="metric-value" style="font-size:1.12rem;line-height:1.35">${escapeHtml(review)}</span>
            </div>
            <div class="metric">
              <span class="label">Theme</span>
              <span class="metric-value" style="font-size:1.12rem;line-height:1.35">${escapeHtml(plan ? plan.title : "计划周期外")}</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  ${SEGMENTS.map((segment) => `<th>${escapeHtml(segment.zh)}</th>`).join("")}
                  <th>一句反思</th>
                </tr>
              </thead>
              <tbody>
                ${days.map((date) => {
                  const key = dateToKey(date);
                  const day = getDay(key);
                  const reflection = day.reflection.trim();
                  const shortReflection = reflection.length > 28 ? `${reflection.slice(0, 28)}...` : reflection;
                  return `
                    <tr class="${key === dateToKey(today()) ? "today-row" : ""}">
                      <td><span class="smallcaps">${escapeHtml(formatShortDate(date))}</span><br><span class="muted">${escapeHtml(weekday(date))}</span></td>
                      ${SEGMENTS.map((segment) => `<td><span class="checkmark ${day.seg[segment.id] ? "done" : ""}" aria-label="${day.seg[segment.id] ? "已完成" : "未完成"}"></span></td>`).join("")}
                      <td class="reflection-cell" title="${escapeHtml(reflection)}">${escapeHtml(shortReflection || "—")}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderPlan() {
        const current = currentWeekNumber();
        const highlighted = current > 12 ? 12 : current;
        const notice = current < 1
          ? `<div class="notice">计划尚未开始。当前日期早于第 1 周开始日期。</div>`
          : current > 12
            ? `<div class="notice">当前已在第 ${current} 周，12 周计划周期已完成。此处保留第 12 周作为最近有效周。</div>`
            : "";
        return `
          ${sectionHead(3, "计划", "完整 12 周训练目录。", `<span>Start ${escapeHtml(state.meta.start)}</span>`)}
          ${notice}
          ${PHASES.map((phase) => `
            <section class="phase-block">
              <h3 class="phase-title">${escapeHtml(phase)}</h3>
              ${WEEK_PLANS.filter((plan) => plan.phase === phase).map((plan) => `
                <article class="plan-week ${plan.week === highlighted ? "current" : ""}">
                  <div class="week-number">W${plan.week}</div>
                  <div>
                    <h4>${escapeHtml(plan.title)}</h4>
                    <dl class="definition-list">
                      <div><dt>目标</dt><dd>${escapeHtml(plan.goal)}</dd></div>
                      <div><dt>每日</dt><dd>${escapeHtml(plan.daily)}</dd></div>
                      <div><dt>复盘</dt><dd>${escapeHtml(plan.review)}</dd></div>
                    </dl>
                  </div>
                </article>
              `).join("")}
            </section>
          `).join("")}
        `;
      }

      function renderTemplates() {
        return `
          ${sectionHead(4, "模板", "六个可复制的训练骨架。")}
          <div class="ledger-list">
            ${TEMPLATES.map((template, index) => `
              <article class="template-item">
                <div class="template-head">
                  <h3>${escapeHtml(template.title)}</h3>
                  <button class="button" type="button" data-copy-template="${index}">复制</button>
                </div>
                <pre class="template-body ${template.mode === "code" ? "code" : ""}" id="template-${index}">${escapeHtml(template.text)}</pre>
              </article>
            `).join("")}
          </div>
        `;
      }

      function heatAlpha(count) {
        if (count <= 0) return 0;
        return Math.min(0.82, 0.12 + count * 0.11).toFixed(2);
      }

      function renderProgress() {
        const stats = progressStats();
        const begin = startDate();
        const now = today();
        const windowStart = addDays(now, -83);
        const reflections = allDayKeys()
          .reverse()
          .map((key) => ({ key, day: getDay(key) }))
          .filter((entry) => entry.day.reflection.trim())
          .slice(0, 8);

        return `
          ${sectionHead(5, "进度", "最近十二周和整个周期的训练痕迹。", `<span>Start ${escapeHtml(state.meta.start)}</span>`)}
          ${state.flash ? `<div class="notice">${escapeHtml(state.flash)}</div>` : ""}
          <div class="stats-grid">
            <div class="metric">
              <span class="label">Qualified</span>
              <span class="metric-value">${stats.qualified}</span>
            </div>
            <div class="metric">
              <span class="label">Current</span>
              <span class="metric-value">${stats.current}</span>
            </div>
            <div class="metric">
              <span class="label">Longest</span>
              <span class="metric-value">${stats.longest}</span>
            </div>
            <div class="metric">
              <span class="label">${stats.startedDays} Days Rate</span>
              <span class="metric-value">${stats.rate}%</span>
            </div>
          </div>
          <section class="progress-grid">
            <div>
              <div class="label">Recent 12 Weeks</div>
              <div class="heatmap-shell" aria-label="最近 12 周热力图">
                <div class="heatmap">
                  ${Array.from({ length: 12 }, (_, column) => `
                    <div class="heat-week">
                      ${Array.from({ length: 7 }, (_, row) => {
                        const date = addDays(windowStart, column * 7 + row);
                        const key = dateToKey(date);
                        const count = completionCount(getDay(key));
                        const beforeStart = diffDays(begin, date) < 0;
                        return `<span class="heat-cell ${key === dateToKey(now) ? "today" : ""} ${beforeStart ? "before-start" : ""}" style="--heat:${heatAlpha(count)}" title="${escapeHtml(key)} · 完成 ${count}/6"></span>`;
                      }).join("")}
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
            <div>
              <div class="label">Recent Reflections</div>
              <ul class="reflection-list">
                ${reflections.length ? reflections.map((entry) => `
                  <li>
                    <span class="reflection-date">${escapeHtml(entry.key)}</span>
                    <span>${escapeHtml(entry.day.reflection)}</span>
                  </li>
                `).join("") : `<li><span class="reflection-date">—</span><span class="muted">暂无反思记录</span></li>`}
              </ul>
            </div>
            <section class="settings-panel">
              <h3>设置</h3>
              <div class="settings-grid">
                <div>
                  <label class="label" for="start-date">第 1 周开始日期</label>
                  <input id="start-date" type="date" value="${escapeHtml(state.meta.start)}">
                </div>
                <div class="button-row">
                  <button class="button" type="button" data-progress-action="export">导出 JSON</button>
                  <button class="button" type="button" data-progress-action="import">导入 JSON</button>
                  <button class="button danger" type="button" data-progress-action="clear">${state.clearArmed ? "再次确认清空" : "清空全部"}</button>
                  <input class="visually-hidden" id="import-file" type="file" accept="application/json,.json">
                </div>
              </div>
            </section>
          </section>
        `;
      }

      function bindPageEvents() {
        if (state.route === "today") bindTodayEvents();
        if (state.route === "week") bindWeekEvents();
        if (state.route === "templates") bindTemplateEvents();
        if (state.route === "progress") bindProgressEvents();
      }

      function bindTodayEvents() {
        const key = dateToKey(today());
        document.querySelectorAll("[data-segment]").forEach((button) => {
          button.addEventListener("click", () => {
            const day = getDay(key);
            const segment = button.dataset.segment;
            day.seg[segment] = !day.seg[segment];
            saveDay(key, day);
            render();
          });
        });
        const note = document.getElementById("today-note");
        const reflection = document.getElementById("today-reflection");
        note.addEventListener("input", () => {
          const day = getDay(key);
          day.note = note.value;
          saveDay(key, day);
        });
        reflection.addEventListener("input", () => {
          const day = getDay(key);
          day.reflection = reflection.value;
          saveDay(key, day);
        });
      }

      function bindWeekEvents() {
        document.querySelectorAll("[data-week-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.weekAction;
            if (action === "prev") state.selectedWeek = Math.max(1, (state.selectedWeek || 1) - 1);
            if (action === "next") state.selectedWeek = (state.selectedWeek || 1) + 1;
            if (action === "current") state.selectedWeek = Math.max(1, currentWeekNumber());
            render();
          });
        });
      }

      function fallbackCopy(text, element) {
        try {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.setAttribute("readonly", "");
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(helper);
          return ok;
        } catch (error) {
          const range = document.createRange();
          range.selectNodeContents(element);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          return false;
        }
      }

      function bindTemplateEvents() {
        document.querySelectorAll("[data-copy-template]").forEach((button) => {
          button.addEventListener("click", async () => {
            const index = Number(button.dataset.copyTemplate);
            const template = TEMPLATES[index];
            const element = document.getElementById(`template-${index}`);
            let copied = false;
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(template.text);
                copied = true;
              }
            } catch (error) {
              copied = false;
            }
            if (!copied) copied = fallbackCopy(template.text, element);
            if (copied) {
              const previous = button.textContent;
              button.textContent = "已复制";
              window.setTimeout(() => {
                button.textContent = previous;
              }, 1400);
            }
          });
        });
      }

      function exportData() {
        const payload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          meta: state.meta,
          days: {}
        };
        allDayKeys().forEach((key) => {
          payload.days[key] = getDay(key);
        });
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `ability-trainer-${dateToKey(today())}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function importData(payload) {
        if (!payload || typeof payload !== "object") {
          throw new Error("Invalid JSON");
        }
        let imported = 0;
        if (payload.meta && keyToDate(payload.meta.start)) {
          saveMeta({ start: payload.meta.start });
        }

        const dayEntries = [];
        if (payload.days && typeof payload.days === "object") {
          Object.entries(payload.days).forEach(([key, value]) => {
            if (keyToDate(key)) dayEntries.push([key, value]);
          });
        }
        Object.entries(payload).forEach(([key, value]) => {
          if (key.startsWith(DAY_PREFIX)) {
            const dateKey = key.slice(DAY_PREFIX.length);
            if (keyToDate(dateKey)) dayEntries.push([dateKey, value]);
          }
        });

        dayEntries.forEach(([key, value]) => {
          saveDay(key, normalizeDay(value));
          imported += 1;
        });
        state.meta = loadMeta();
        state.selectedWeek = Math.max(1, currentWeekNumber());
        setFlash(`已按天合并导入 ${imported} 天记录。`);
        render();
      }

      function clearAllData() {
        listStorageKeys().forEach((key) => {
          if (key === META_KEY || key.startsWith(DAY_PREFIX)) removeRaw(key);
        });
        Object.keys(memoryStore).forEach((key) => {
          if (key === META_KEY || key.startsWith(DAY_PREFIX)) delete memoryStore[key];
        });
        state.meta = loadMeta();
        state.selectedWeek = Math.max(1, currentWeekNumber());
        state.clearArmed = false;
        setFlash("已清空本应用数据，并把开始日期重设为今天。");
        render();
      }

      function bindProgressEvents() {
        const startInput = document.getElementById("start-date");
        startInput.addEventListener("change", () => {
          if (!keyToDate(startInput.value)) return;
          state.meta = { start: startInput.value };
          saveMeta(state.meta);
          state.selectedWeek = Math.max(1, currentWeekNumber());
          render();
        });

        const importFile = document.getElementById("import-file");
        importFile.addEventListener("change", () => {
          const file = importFile.files && importFile.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            try {
              importData(JSON.parse(String(reader.result || "{}")));
            } catch (error) {
              setFlash("导入失败：JSON 格式或数据结构不正确。");
              render();
            }
          });
          reader.readAsText(file);
        });

        document.querySelectorAll("[data-progress-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.progressAction;
            if (action === "export") exportData();
            if (action === "import") importFile.click();
            if (action === "clear") {
              if (!state.clearArmed) {
                state.clearArmed = true;
                window.clearTimeout(state.clearTimer);
                state.clearTimer = window.setTimeout(() => {
                  state.clearArmed = false;
                  if (state.route === "progress") render();
                }, 5200);
                render();
              } else {
                clearAllData();
              }
            }
          });
        });
      }

      function init() {
        state.meta = loadMeta();
        state.selectedWeek = Math.max(1, currentWeekNumber());
        window.addEventListener("hashchange", render);
        if (!window.location.hash) {
          window.location.hash = "today";
        }
        render();
        document.getElementById("loading").hidden = true;
        document.getElementById("app").hidden = false;
      }

      init();
    })();
  </script>
</body>
</html>
