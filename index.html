<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能力训练账本</title>
  <meta name="description" content="一个纯静态的个人能力训练打卡网站，用于记录思考、表达与职场沟通的 12 周练习。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F1EEE4'/%3E%3Cpath d='M15 10h34v44H15z' fill='none' stroke='%23174D3A' stroke-width='4'/%3E%3Cpath d='M23 19h18M23 28h18M23 37h12' stroke='%2325211B' stroke-width='3' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F1F2ED;
      --ink: #19231F;
      --muted: #4F574F;
      --line: #C9CBC0;
      --accent: #174D3A;
      --measure: 62ch;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
      --serif: "Newsreader", "Noto Serif SC", Georgia, "Times New Roman", serif;
      --surface: #FBFAF3;
      --line-soft: #E1E3DA;
      --accent-deep: #0E3326;
      --cjk: "Noto Serif SC", "Songti SC", "SimSun", serif;
    }

    * {
      box-sizing: border-box;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.18em;
    }

    ::selection {
      background: rgba(23, 77, 58, 0.18);
    }

    .loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
    }

    .app[hidden], .loading[hidden] {
      display: none;
    }

    .kicker, .label, .fineprint, .muted {
      color: var(--muted);
    }

    .margin-note p {
      margin: 6px 0 0;
    }

    .ledger-panel + .ledger-panel, .ledger-list + .ledger-panel, .template-item + .template-item, .plan-week + .plan-week, .settings-panel + .settings-panel {
      margin-top: 28px;
    }

    .stats-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .segment-button:hover, .segment-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .segment-button[aria-pressed="true"] .box::before, .habit-item[aria-pressed="true"] .box::before, .schedule-block[aria-pressed="true"] .box::before, .checkmark.done::before {
      content: "✓";
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
    }

    input[type="date"] {
      min-height: 42px;
      padding: 8px 10px;
      font-family: var(--mono);
      color: var(--ink);
    }

    textarea:focus-visible, input:focus-visible, select:focus-visible, .button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .button.danger {
      border-color: var(--ink);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .phase-block + .phase-block {
      margin-top: 42px;
    }

    .phase-title::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--line);
    }

    .plan-week h4, .template-item h3, .settings-panel h3 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      line-height: 1.25;
      font-weight: 500;
    }

    .definition-list {
      display: grid;
      gap: 7px;
      margin: 12px 0 0;
    }

    .definition-list div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 12px;
    }

    .definition-list dd {
      margin: 0;
    }

    .template-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .template-body {
      margin: 0;
      max-width: var(--measure);
      white-space: pre-wrap;
      color: var(--ink);
    }

    .progress-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(12, minmax(28px, 1fr));
      gap: 8px;
      min-width: 520px;
    }

    .heat-cell.today {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .heat-cell.before-start::after {
      content: "";
      position: absolute;
      inset: 45% 18%;
      border-top: 1px solid rgba(94, 87, 75, 0.62);
    }

    .reflection-date {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(220px, 0.6fr) minmax(0, 1fr);
      gap: 18px;
      align-items: end;
    }

    @media (max-width: 920px) {
      .week-brief, .metric-strip, .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 680px) {
      .masthead, .week-brief, .metric-strip, .stats-grid, .field-grid, .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .site-title {
        font-size: clamp(2rem, 14vw, 3.5rem);
      }
    }

    @media (max-width: 680px) {
      .section-head h2 {
        font-size: clamp(1.9rem, 12vw, 3rem);
      }
    }

    @media (max-width: 680px) {
      .segment-code {
        grid-column: 2;
      }
    }

    @media (max-width: 680px) {
      .plan-week, .reflection-list li, .definition-list div {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    html {
      font-size: 16px;
      font-variant-numeric: oldstyle-nums tabular-nums;
      scroll-behavior: smooth;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      text-rendering: optimizeLegibility;
      background: var(--paper);
      font-family: var(--cjk);
      line-height: 1.68;
    }

    .app {
      margin: 0 auto;
      width: min(960px, calc(100% - 40px));
      padding: 0 0 34px;
    }

    .site-header {
      padding-bottom: 18px;
      margin-bottom: 42px;
      border-bottom: 2px solid var(--ink);
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 0 22px;
      padding: 16px 0 0;
      background: var(--paper);
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: baseline;
    }

    .site-title {
      margin: 0;
      letter-spacing: 0;
      font-size: clamp(1.38rem, 3vw, 1.72rem);
      line-height: 1.12;
      font-weight: 500;
      display: inline;
      font-family: var(--serif);
    }

    .site-subtitle {
      max-width: 44rem;
      margin: 0 0 0 10px;
      color: var(--muted);
      font-size: 0.92rem;
      display: inline;
    }

    .kicker, .label, .nav-link, .button, .smallcaps {
      font-variant-caps: small-caps;
      text-transform: uppercase;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }

    .kicker {
      margin-bottom: 4px;
      color: var(--accent);
    }

    #header-date {
      color: var(--accent);
      text-align: right;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      overflow-x: auto;
      scrollbar-width: thin;
      gap: 0;
      margin-top: 13px;
      padding-top: 0;
      border-top: 0;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      border: 0;
      background: transparent;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      min-height: 40px;
      padding: 10px 14px 9px;
      border-top: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--cjk);
      font-size: 0.93rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .nav-link:hover, .nav-link:focus-visible, .nav-link.active {
      outline: 0;
      color: var(--ink);
      border-top-color: transparent;
      border-bottom-color: var(--accent);
    }

    .layout {
      display: grid;
      align-items: start;
      grid-template-columns: minmax(0, 1fr) 188px;
      gap: 34px;
    }

    .main {
      min-width: 0;
      max-width: 740px;
    }

    .margin-notes {
      position: sticky;
      padding-left: 18px;
      top: 96px;
      border-left: 2px solid var(--ink);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .margin-note + .margin-note {
      border-top: 1px solid var(--line);
      margin-top: 16px;
      padding-top: 14px;
      border-top-color: var(--line-soft);
    }

    .section-head {
      margin-bottom: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .section-head h2 {
      margin: 0;
      max-width: var(--measure);
      letter-spacing: 0;
      font-size: clamp(1.65rem, 4vw, 2.34rem);
      line-height: 1.12;
      font-weight: 500;
      font-family: var(--serif);
    }

    h1, h2, h3, .site-title, .section-head h2, .week-title {
      text-wrap: balance;
    }

    .section-head p {
      max-width: var(--measure);
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.97rem;
      margin-top: 8px;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      font-family: var(--mono);
      gap: 8px 16px;
      margin-top: 11px;
      color: var(--accent);
      font-size: 0.76rem;
    }

    .week-brief {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 5px 14px;
      margin-bottom: 8px;
      padding: 7px 10px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: var(--ink);
      color: var(--paper);
    }

    .brief-cell {
      border-top: 0;
      padding-top: 0;
      min-width: 0;
      flex: 1 1 170px;
    }

    .brief-cell .label {
      color: #B8C6BC;
      margin-right: 5px;
    }

    .brief-cell strong {
      display: inline;
      margin-top: 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--paper);
      line-height: 1.32;
    }

    .metric-strip, .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 22px;
    }

    .metric {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 13px 14px;
      text-align: center;
    }

    .metric-value {
      display: block;
      line-height: 1;
      margin-top: 6px;
      color: var(--accent);
      font-size: 2rem;
      font-weight: 500;
      font-family: var(--serif);
    }

    .metric-value.good {
      color: var(--accent);
    }

    .today-metrics {
      gap: 0;
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .today-metrics .metric {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      border-right: 1px solid var(--line-soft);
      border-radius: 0;
      padding: 8px 12px;
      background: transparent;
      text-align: left;
    }

    .today-metrics .metric:last-child {
      border-right: 0;
    }

    .today-metrics .metric-value {
      display: inline;
      margin-top: 0;
      font-size: 1.12rem;
      line-height: 1.1;
    }

    .ledger-panel, .ledger-list, .template-item, .plan-week, .settings-panel {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
      border-color: var(--line-soft);
    }

    .daily-engine-panel {
      padding: 12px 0;
    }

    .segments {
      display: grid;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      gap: 10px;
      margin: 14px 0 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 0;
    }

    .daily-engine-panel .segments {
      gap: 8px;
      margin: 8px 0 0;
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }

    .segment-button {
      display: grid;
      align-items: center;
      width: 100%;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 8px 10px;
      min-height: 104px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      background: var(--surface);
      grid-template-rows: auto auto;
      border-radius: 8px;
    }

    .segment-button[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .daily-engine-panel .segment-button {
      grid-template-columns: 1fr;
      justify-items: center;
      min-height: 66px;
      padding: 9px 8px;
      text-align: center;
    }

    .segment-button:hover {
      border-color: var(--ink);
    }

    .segment-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .box {
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--ink);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 1rem;
      line-height: 1;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border-color: currentColor;
    }

    .segment-button[aria-pressed="true"] .box {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }

    .segment-title {
      display: block;
      line-height: 1.18;
      font-size: 1.02rem;
      font-weight: 600;
    }

    .daily-engine-panel .segment-title {
      font-size: 0.98rem;
    }

    .segment-button[aria-pressed="true"] .segment-code {
      color: #B8C6BC;
    }

    .segment-code {
      font-family: var(--mono);
      font-variant-caps: small-caps;
      letter-spacing: 0.07em;
      white-space: nowrap;
      color: var(--accent);
      font-size: 0.67rem;
      grid-column: 2;
    }

    .daily-engine-panel .segment-code {
      font-size: 0.62rem;
      grid-column: auto;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    textarea, input[type="date"], input[type="search"], input[type="file"], select {
      width: 100%;
      border: 1px solid var(--line);
      color: var(--ink);
      background: var(--surface);
      border-radius: 8px;
      border-color: var(--line);
    }

    input[type="search"], select {
      min-height: 42px;
      padding: 8px 10px;
      font-family: var(--cjk);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      line-height: 1.58;
      min-height: 146px;
      padding: 12px 13px;
      font-family: var(--cjk);
      font-size: 0.95rem;
    }

    .analysis-panel {
      margin-top: 20px;
    }

    .daily-engine-panel + .analysis-panel {
      margin-top: 10px;
    }

    .analysis-panel > p {
      max-width: var(--measure);
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .analysis-panel h3 {
      margin: 4px 0 0;
      font-family: var(--serif);
      font-size: 1.28rem;
      font-weight: 500;
      line-height: 1.25;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .analysis-field {
      min-width: 0;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
    }

    .analysis-field label {
      display: block;
      margin-bottom: 7px;
    }

    .analysis-field textarea {
      min-height: 110px;
      border-radius: 6px;
      background: var(--paper);
    }

    .analysis-field.conclusion {
      grid-column: 1 / -1;
    }

    .analysis-field.conclusion textarea {
      min-height: 86px;
      font-size: 1rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      min-height: 36px;
      background: var(--surface);
      border-radius: 8px;
      border-color: var(--line);
      font-family: var(--cjk);
      font-size: 0.88rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .button.primary {
      border-color: var(--ink);
      color: var(--paper);
      background: var(--ink);
    }

    .button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .button.primary:hover {
      color: var(--paper);
      background: var(--accent-deep);
      border-color: var(--accent-deep);
    }

    .manual-save-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
    }

    .save-status {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }

    .week-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .week-title {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.2;
      font-weight: 500;
      font-family: var(--serif);
    }

    .table-wrap {
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      color: var(--ink);
      font-size: 0.88rem;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      text-align: left;
      padding: 9px 10px;
      border-bottom-color: var(--line-soft);
    }

    th {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
      font-weight: 500;
      color: var(--muted);
      background: #E9EBE2;
      border-bottom: 1px solid var(--ink);
    }

    .checkmark {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid var(--line);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.78rem;
      border-radius: 3px;
      border-color: var(--line);
    }

    .checkmark.done {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--paper);
    }

    .today-row td:first-child {
      border-left: 3px solid var(--accent);
      padding-left: 7px;
      border-left-color: var(--accent);
    }

    tr[data-week-date] {
      cursor: pointer;
    }

    tr[data-week-date]:hover td, tr[data-week-date]:focus-visible td, .editing-row td {
      background: var(--paper);
    }

    tr[data-week-date]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .reflection-cell {
      max-width: 230px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: top;
    }

    .reflection-cell.expanded {
      max-width: 320px;
      white-space: normal;
    }

    .reflection-toggle {
      display: inline-flex;
      margin-left: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }

    .week-edit-panel {
      margin-top: 20px;
      padding: 17px 18px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      background: var(--surface);
    }

    .week-edit-panel h3 {
      margin: 4px 0 4px;
      font-family: var(--serif);
      font-size: 1.32rem;
      font-weight: 500;
    }

    .metric-strip.compact {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 14px;
    }

    .week-edit-segments {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 16px 0 4px;
    }

    .week-edit-segment {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 4px 8px;
      align-items: center;
      min-height: 58px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .week-edit-segment small {
      grid-column: 2;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .week-edit-segment[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .week-edit-segment[aria-pressed="true"] small {
      color: #B8C6BC;
    }

    .week-edit-segment[aria-pressed="true"] .box {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }

    .phase-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 600;
      font-family: var(--serif);
    }

    .plan-week {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 16px;
      padding: 13px 0;
    }

    .plan-week.current {
      border-top-color: var(--accent);
      border-bottom-color: var(--accent);
      margin: 0 -12px;
      padding: 13px 12px;
      border-radius: 8px;
      border-color: var(--accent);
      background: var(--surface);
    }

    .week-number {
      font-family: var(--mono);
      font-size: 0.86rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .definition-list dt {
      font-family: var(--mono);
      font-size: 0.76rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.07em;
      color: var(--accent);
    }

    .template-item {
      margin-top: 14px;
      padding: 16px 18px;
      border: 1px dashed var(--accent);
      border-radius: 8px;
      background: var(--surface);
    }

    .template-body.code {
      border-left: 1px solid var(--line);
      padding-left: 16px;
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.65;
      border-left-color: var(--accent);
      background: var(--ink);
      color: var(--paper);
      border-radius: 8px;
      padding: 14px 15px;
    }

    .heatmap-shell {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .heat-week {
      display: grid;
      gap: 6px;
      grid-template-rows: repeat(7, 18px);
    }

    .heat-cell {
      border: 1px solid var(--line);
      background-color: rgba(23, 77, 58, var(--heat));
      position: relative;
      border-color: var(--line-soft);
      border-radius: 3px;
    }

    .heat-legend {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.72rem;
    }

    .legend-swatch {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 1px solid var(--line-soft);
      border-radius: 3px;
      background: rgba(23, 77, 58, var(--heat));
    }

    .reflection-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
      border-top-color: var(--line);
    }

    .reflection-list li {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      border-bottom-color: var(--line-soft);
    }

    .archive-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(160px, 0.34fr);
      gap: 12px;
      align-items: end;
      margin-bottom: 18px;
    }

    .archive-list {
      display: grid;
      gap: 14px;
    }

    .archive-item {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      border-color: var(--line-soft);
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }

    .archive-toggle {
      display: grid;
      grid-template-columns: 138px minmax(0, 1fr);
      gap: 16px;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .archive-toggle:hover, .archive-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      background: var(--paper);
    }

    .archive-meta {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      line-height: 1.55;
      text-transform: uppercase;
    }

    .archive-title {
      display: block;
      font-family: var(--serif);
      font-size: 1.16rem;
      font-weight: 500;
      line-height: 1.38;
    }

    .archive-full {
      display: none;
      padding: 0 16px 15px 170px;
      border-top: 1px solid var(--line-soft);
    }

    .archive-item.expanded .archive-full {
      display: block;
    }

    .archive-fields {
      margin: 0;
      padding: 12px 0 0;
    }

    .archive-fields div {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .archive-fields div:last-child {
      border-bottom: 0;
    }

    .archive-fields dt {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .archive-fields dd {
      margin: 0;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .habit-section {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .habit-section + .habit-section {
      margin-top: 30px;
    }

    .habit-section h3 {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: var(--serif);
      font-size: 1.24rem;
      font-weight: 500;
      line-height: 1.25;
    }

    .habit-list {
      border-top: 1px solid var(--line-soft);
    }

    .habit-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 10px 12px;
      width: 100%;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .habit-item:hover, .habit-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      background: var(--surface);
    }

    .habit-item[aria-pressed="true"] .box {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }

    .habit-action {
      display: block;
      font-weight: 600;
      line-height: 1.38;
    }

    .habit-desc, .habit-date {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .habit-date {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .habit-id {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .schedule-rule-strip {
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
      margin: 0 0 24px;
    }

    .schedule-rule {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      line-height: 1.55;
    }

    .schedule-rule:last-child {
      border-bottom: 0;
    }

    .schedule-rule-number {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
    }

    .schedule-rule.critical {
      color: var(--ink);
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      background: var(--surface);
    }

    .schedule-signal {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      margin: 0 0 18px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .schedule-signal strong {
      color: var(--accent);
      font-family: var(--serif);
      font-size: 1.18rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .track-setting {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      margin: 0 0 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .track-setting p {
      margin: 5px 0 0;
    }

    .track-options {
      display: inline-flex;
      gap: 8px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .track-button {
      min-height: 34px;
      padding: 6px 11px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .track-button:hover, .track-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .track-button[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .schedule-sheet {
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }

    .schedule-block {
      display: grid;
      grid-template-columns: 28px 114px minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      min-height: 72px;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .schedule-block:last-child {
      border-bottom: 0;
    }

    .schedule-block:hover, .schedule-block:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      background: var(--surface);
    }

    .schedule-block[aria-pressed="true"] .box {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--paper);
    }

    .schedule-block.nonnegotiable {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      background: var(--surface);
    }

    .schedule-time {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      line-height: 1.55;
      white-space: nowrap;
    }

    .schedule-content {
      display: block;
      line-height: 1.55;
    }

    .schedule-text {
      display: block;
      font-weight: 600;
    }

    .schedule-detail, .schedule-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .schedule-tag {
      display: inline-block;
      margin: 0 0 5px;
      padding: 1px 6px 2px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.68rem;
      font-variant-caps: small-caps;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .settings-panel {
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .notice {
      border-left: 2px solid var(--accent);
      padding: 9px 0 9px 14px;
      color: var(--muted);
      margin: 18px 0;
      border-left-color: var(--accent);
      background: var(--surface);
      border-radius: 0 8px 8px 0;
    }

    .site-footer {
      margin-top: 62px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--muted);
      border-top-color: var(--line-soft);
    }

    .visually-hidden {
      position: absolute;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      border: 0 !important;
    }

    @media (max-width: 920px) {
      .app {
        width: min(100% - 28px, 760px);
      }
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    @media (max-width: 920px) {
      .main {
        max-width: none;
      }
    }

    @media (max-width: 920px) {
      .margin-notes {
        position: static;
        border-left: 0;
        border-top: 2px solid var(--ink);
        padding: 16px 0 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
    }

    @media (max-width: 920px) {
      .margin-note + .margin-note {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }
    }

    @media (max-width: 680px) {
      body {
        background: var(--paper);
      }
    }

    @media (max-width: 680px) {
      .app {
        padding-top: 28px;
        width: min(100% - 24px, 760px);
      }
    }

    @media (max-width: 680px) {
      .site-header {
        position: static;
      }
    }

    @media (max-width: 680px) {
      .masthead {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media (max-width: 680px) {
      .site-subtitle {
        font-size: 1rem;
        display: block;
        margin: 6px 0 0;
      }
    }

    @media (max-width: 680px) {
      #header-date {
        text-align: left;
      }
    }

    @media (max-width: 680px) {
      .nav {
        gap: 16px;
        overflow-x: auto;
      }
    }

    @media (max-width: 680px) {
      .nav-link {
        padding-inline: 11px;
      }
    }

    @media (max-width: 680px) {
      .week-brief, .metric-strip, .stats-grid, .field-grid, .analysis-grid, .settings-grid, .archive-controls, .schedule-signal, .track-setting {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .track-options {
        width: 100%;
      }

      .track-button {
        flex: 1;
      }

      .schedule-block {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .schedule-time {
        grid-column: 2;
      }

      .schedule-content {
        grid-column: 2;
      }
    }

    @media (max-width: 680px) {
      .segments {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .daily-engine-panel .segments {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .segment-button {
        grid-template-columns: 30px minmax(0, 1fr);
        min-height: 104px;
      }
    }

    @media (max-width: 680px) {
      .metric-strip.compact, .week-edit-segments {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .today-metrics .metric {
        border-right: 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .today-metrics .metric:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 680px) {
      .margin-notes {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .segments {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .daily-engine-panel .segments {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .archive-toggle, .archive-fields div {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media (max-width: 680px) {
      .archive-full {
        padding: 0 16px 15px;
      }
    }

    @media print {
      body,
      .app {
        background: transparent;
        color: #000;
      }

      .app {
        width: auto;
        padding: 0;
      }

      .site-header,
      .margin-notes,
      .site-footer,
      .button-row,
      .archive-controls,
      .week-brief,
      .settings-panel {
        display: none !important;
      }

      a,
      .label,
      .kicker,
      .muted,
      .meta-line,
      .metric-value,
      .phase-title,
      .week-number,
      .definition-list dt,
      .archive-meta,
      .archive-fields dt,
      .reflection-cell,
      .reflection-date {
        color: #000 !important;
      }

      .layout {
        display: block;
      }

      .main {
        max-width: none;
      }

      .section-head,
      .metric,
      .table-wrap,
      .week-edit-panel,
      .heatmap-shell,
      .reflection-list,
      .archive-item,
      .archive-full,
      .plan-week,
      .template-item {
        border-color: #000;
        background: transparent;
      }

      .archive-full {
        display: block !important;
        padding: 0 0 12px;
      }

      .archive-toggle {
        padding: 10px 0;
      }

      .archive-fields div {
        border-color: #000;
      }

      table {
        min-width: 0;
        font-size: 10pt;
      }

      th,
      td {
        border: 1px solid #000;
        color: #000;
        background: transparent !important;
      }

      .checkmark.done,
      .heat-cell,
      .legend-swatch {
        background: transparent !important;
        border-color: #000;
      }

      .checkmark.done::before {
        color: #000;
      }

      .reflection-toggle,
      .visually-hidden {
        display: none !important;
      }
    }

  </style>
</head>
<body>
  <div id="loading" class="loading">Loading ledger...</div>
  <div id="app" class="app" hidden>
    <header class="site-header">
      <div class="masthead">
        <div>
          <div class="kicker">Personal Training Ledger</div>
          <h1 class="site-title">能力训练账本</h1>
          <p class="site-subtitle">记录每天的思考、表达与职场沟通训练。</p>
        </div>
        <div class="kicker" id="header-date"></div>
      </div>
      <nav class="nav" aria-label="主导航">
        <a class="nav-link" href="#today" data-route="today">§1 今天</a>
        <a class="nav-link" href="#week" data-route="week">§2 本周</a>
        <a class="nav-link" href="#plan" data-route="plan">§3 计划</a>
        <a class="nav-link" href="#templates" data-route="templates">§4 模板</a>
        <a class="nav-link" href="#progress" data-route="progress">§5 进度</a>
        <a class="nav-link" href="#archive" data-route="archive">§6 回顾</a>
        <a class="nav-link" href="#habits" data-route="habits">§7 习惯</a>
        <a class="nav-link" href="#schedule" data-route="schedule">§8 日程</a>
      </nav>
    </header>
    <div class="layout">
      <main id="view" class="main" tabindex="-1"></main>
      <aside id="margin-notes" class="margin-notes" aria-label="页边注"></aside>
    </div>
    <footer class="site-footer">
      低调署名：<a href="https://github.com/ricardo-zihao-lin">https://github.com/ricardo-zihao-lin</a>
    </footer>
  </div>
  <script>
    (() => {
      "use strict";

      const APP = "ability-trainer:v1";
      const META_KEY = `${APP}:meta`;
      const DAY_PREFIX = `${APP}:day:`;
      const WEEK_HABITS_PREFIX = `${APP}:weekhabits:`;
      const ONCE_HABITS_KEY = `${APP}:oncehabits`;
      const DAY_MS = 86400000;
      const ROUTES = ["today", "week", "plan", "templates", "progress", "archive", "habits", "schedule"];

      const SEGMENTS = [
        { id: "input", zh: "输入", en: "Input", desc: "读、听或观察，留下一个真实问题。" },
        { id: "think", zh: "思考", en: "Think", desc: "拆一件小事，追问来历、条件与耦合。" },
        { id: "output", zh: "输出", en: "Output", desc: "写一段英文，结论先行。" },

      function pad(number) {
        return String(number).padStart(2, "0");
      }

      function localDate(date = new Date()) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0, 0);
      }

      function today() {
        return localDate(new Date());
      }

      function dateToKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function keyToDate(key) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(key))) return null;
        const [year, month, day] = key.split("-").map(Number);
        const date = new Date(year, month - 1, day, 12, 0, 0, 0);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
        return date;
      }

      function addDays(date, days) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days, 12, 0, 0, 0);
      }

      function diffDays(start, end) {
        const a = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
        const b = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
        return Math.floor((b - a) / DAY_MS);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric" }).format(date);
      }

      function formatShortDate(date) {
        return new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit" }).format(date);
      }

      function weekday(date) {
        return new Intl.DateTimeFormat("zh-CN", { weekday: "long" }).format(date);
      }

      function dayStorageKey(key) {

      function canUseLocalStorage() {
        try {
          const probe = `${APP}:probe`;
          window.localStorage.setItem(probe, "1");
          window.localStorage.removeItem(probe);
          state.storageMode = "localStorage";
          return true;
        } catch (error) {
          state.storageMode = "memory";
          return false;
        }
      }

      let localStorageOK = canUseLocalStorage();

      function readRaw(key) {
        if (localStorageOK) {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
      }

      function writeRaw(key, value) {
        if (localStorageOK) {
          try {
            window.localStorage.setItem(key, value);
            return;
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        memoryStore[key] = value;
      }

      function removeRaw(key) {
        if (localStorageOK) {
          try {
            window.localStorage.removeItem(key);
            return;
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        delete memoryStore[key];
      }

      function listStorageKeys() {
        if (localStorageOK) {
          try {
            const keys = [];
            for (let index = 0; index < window.localStorage.length; index += 1) {
              const key = window.localStorage.key(index);
              if (key) keys.push(key);
            }
            return keys;
          } catch (error) {
            localStorageOK = false;
            state.storageMode = "memory";
          }
        }
        return Object.keys(memoryStore);
      }

        const source = value && typeof value === "object" ? value : {};
        return ids.reduce((acc, id) => {

          return acc;

        const source = value && typeof value === "object" ? value : {};
        return habitIdsFor("once").reduce((acc, id) => {
          if (typeof source[id] === "string" && keyToDate(source[id])) acc[id] = source[id];
          return acc;
        }, {});
      }

      function normalizeDay(value) {
        const source = value && typeof value === "object" ? value : {};
        const incomingSeg = source.seg && typeof source.seg === "object" ? source.seg : {};
        const incomingAnalysis = source.analysis && typeof source.analysis === "object" ? source.analysis : {};
        return {
          seg: SEGMENTS.reduce((acc, segment) => {
            acc[segment.id] = Boolean(incomingSeg[segment.id]);
            return acc;
          }, {}),
          analysis: ANALYSIS_FIELDS.reduce((acc, field) => {
            acc[field.id] = typeof incomingAnalysis[field.id] === "string" ? incomingAnalysis[field.id] : "";

        const meta = { start, computerTrack };

      }

      function getOnceHabits() {
        return normalizeOnceHabits(parseJSON(readRaw(ONCE_HABITS_KEY)));
      }

      function saveOnceHabits(habits) {
        writeRaw(ONCE_HABITS_KEY, JSON.stringify(normalizeOnceHabits(habits)));
      }

      function allDayKeys() {
        return Array.from(new Set(
          listStorageKeys()
            .filter((key) => key.startsWith(DAY_PREFIX))
            .map((key) => key.slice(DAY_PREFIX.length))
            .filter((key) => keyToDate(key))
        )).sort();
      }

      function allWeekHabitKeys() {
        return Array.from(new Set(
          listStorageKeys()
            .filter((key) => key.startsWith(WEEK_HABITS_PREFIX))
            .map((key) => key.slice(WEEK_HABITS_PREFIX.length))
            .filter((key) => /^-?\d+$/.test(key))
        )).sort((a, b) => Number(a) - Number(b));
      }

      function completionCount(day) {
        return SEGMENTS.reduce((count, segment) => count + (day.seg[segment.id] ? 1 : 0), 0);
      }

      function isQualified(day) {
        return completionCount(day) >= 4;
      }

      function startDate() {
        return keyToDate(state.meta.start) || today();
      }

      function currentWeekNumber(date = today()) {
        return Math.floor(diffDays(startDate(), date) / 7) + 1;
      }

      function planForWeek(weekNumber) {
        return WEEK_PLANS.find((plan) => plan.week === weekNumber) || null;
      }

      function weekLabelForDate(date) {
        const weekNumber = currentWeekNumber(date);
        return weekNumber < 1 ? "未开始" : `第 ${weekNumber} 周`;
      }

      function hasAnalysis(day) {
        return ANALYSIS_FIELDS.some((field) => day.analysis[field.id].trim());
      }

      function analysisSearchText(day) {
        return ANALYSIS_FIELDS.map((field) => day.analysis[field.id]).join("\n").toLowerCase();
      }

      function renderAnalysisFields(day, prefix, dataset = "") {
        return `
          <div class="analysis-grid">
            ${ANALYSIS_FIELDS.map((field) => `
              <div class="analysis-field ${field.id === "conclusion" ? "conclusion" : ""}">
                <label class="label" for="${prefix}-analysis-${field.id}">
                  ${escapeHtml(field.label)} · ${escapeHtml(field.title)}
                </label>
                <textarea id="${prefix}-analysis-${field.id}" data-analysis-field="${field.id}" ${dataset} autocomplete="off">${escapeHtml(day.analysis[field.id])}</textarea>
              </div>
            `).join("")}
          </div>
        `;
      }

      function todayPlan() {
        const weekNumber = currentWeekNumber();
        if (weekNumber < 1) {
          return {
            weekLabel: "未开始",
            title: "计划尚未开始",
            goal: "第 1 周开始日期还在未来。",
            daily: "先确认第 1 周开始日期，或提前做一次轻量输入与复盘。",
            review: "开始前只需把环境和节奏准备好。"
          };
        }
        if (weekNumber > 12) {
          return {
            weekLabel: `第 ${weekNumber} 周`,
            title: "12 周计划已完成",
            goal: "回看记录，选择下一季仍然薄弱的两项。",
            daily: "做一次完整“输入→输出→讲述”，或按最弱模块补练。",
            review: "写下下一季的训练起点。"
          };
        }
        const plan = planForWeek(weekNumber);
        return {
          weekLabel: `第 ${weekNumber} 周`,
          title: plan.title,
          goal: plan.goal,
          daily: plan.daily,
          review: plan.review
        };
      }

      function currentStreak() {
        let cursor = today();
        if (!isQualified(getDay(dateToKey(cursor)))) {
          cursor = addDays(cursor, -1);
        }
        let streak = 0;
        for (let guard = 0; guard < 3650; guard += 1) {
          if (!isQualified(getDay(dateToKey(cursor)))) break;
          streak += 1;
          cursor = addDays(cursor, -1);
        }
        return streak;
      }

      function progressStats() {
        const begin = startDate();
        const now = today();
        const rawDays = diffDays(begin, now) + 1;
        const visibleDays = Math.max(0, rawDays);
        const denominator = Math.max(1, rawDays);
        let qualified = 0;
        let longest = 0;
        let run = 0;
        for (let index = 0; index < visibleDays; index += 1) {
          const key = dateToKey(addDays(begin, index));
          if (isQualified(getDay(key))) {
            qualified += 1;
            run += 1;
            longest = Math.max(longest, run);
          } else {
            run = 0;
          }
        }
        return {
          startedDays: visibleDays,
          qualified,
          current: currentStreak(),
          longest,
          rate: Math.round((qualified / denominator) * 100)
        };
      }

      function weekStart(weekNumber) {
        return addDays(startDate(), (weekNumber - 1) * 7);
      }

      function routeFromHash() {
        const route = window.location.hash.replace("#", "");
        return ROUTES.includes(route) ? route : "schedule";
      }

      function setFlash(message) {
        state.flash = message;
        window.setTimeout(() => {
          if (state.flash === message) {
            state.flash = "";
            if (state.route === "progress") render();
          }
        }, 3200);
      }

      function render() {
        state.route = routeFromHash();
        const currentWeek = currentWeekNumber();
        if (!state.selectedWeek) state.selectedWeek = Math.max(1, currentWeek);

        document.getElementById("header-date").textContent = `${formatDate(today())} · ${weekday(today())}`;
        document.querySelectorAll(".nav-link").forEach((link) => {
          link.classList.toggle("active", link.dataset.route === state.route);
        });

        const view = document.getElementById("view");
        view.innerHTML = {
          today: renderToday,
          week: renderWeek,
          plan: renderPlan,
          templates: renderTemplates,
          progress: renderProgress,
          archive: renderArchive,
          habits: renderHabits,
          schedule: renderSchedule
        }[state.route]();

        document.getElementById("margin-notes").innerHTML = renderMarginNotes();
        bindPageEvents();
      }

      function renderMarginNotes() {
        const plan = todayPlan();
        const stats = progressStats();
        const storageText = state.storageMode === "localStorage" ? "localStorage" : "内存临时存储";
        return `
          <div class="margin-note">
            <div class="label">Main Line</div>
            <p>解释世界，吸收信息，表达判断，与人共事。</p>
          </div>
          <div class="margin-note">
            <div class="label">Current Folio</div>
            <p>${escapeHtml(plan.weekLabel)} · ${escapeHtml(plan.title)}</p>
          </div>
          <div class="margin-note">
            <div class="label">Rule</div>
            <p>每日六段完成至少四段，即记为达标。</p>
          </div>
          <div class="margin-note">
            <div class="label">Continuity</div>
            <p>当前连续 ${stats.current} 天；最长连续 ${stats.longest} 天。</p>
          </div>
          <div class="margin-note">
            <div class="label">Storage</div>
            <p>${storageText} · 数据只留在本浏览器。</p>
          </div>
        `;
      }

      function sectionHead(number, title, subtitle, meta = "") {
        return `
          <section class="section-head">
            <div class="kicker">§${number}</div>
            <h2>${escapeHtml(title)}</h2>
            ${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ""}
            ${meta ? `<div class="meta-line">${meta}</div>` : ""}
          </section>
        `;
      }

      function renderToday() {
        const key = dateToKey(today());
        const day = getDay(key);
        const count = completionCount(day);
        const stats = progressStats();
        const plan = todayPlan();
        const completeText = count >= 4 ? "达标" : "未达标";
        const meta = `<span>${escapeHtml(formatDate(today()))}</span><span>${escapeHtml(weekday(today()))}</span><span>${escapeHtml(plan.weekLabel)}</span>`;
        return `
          ${sectionHead(1, "今天", "", meta)}
          <div class="week-brief">
            <div class="brief-cell">
              <span class="label">Theme</span>
              <strong>${escapeHtml(plan.title)}</strong>
            </div>
            <div class="brief-cell">
              <span class="label">Goal</span>
              <strong>${escapeHtml(plan.goal)}</strong>
            </div>
            <div class="brief-cell">
              <span class="label">Today</span>
              <strong>${escapeHtml(plan.daily)}</strong>
            </div>
          </div>
          <div class="metric-strip today-metrics" aria-label="今日统计">
            <div class="metric">
              <span class="label">Completed</span>
              <span class="metric-value">${count}/6</span>
            </div>
            <div class="metric">
              <span class="label">Streak</span>
              <span class="metric-value">${stats.current}</span>
            </div>
            <div class="metric">
              <span class="label">Status</span>
              <span class="metric-value ${count >= 4 ? "good" : ""}">${completeText}</span>
            </div>
          </div>
          <div class="ledger-panel daily-engine-panel">
            <div class="label">Daily Engine</div>
            <div class="segments">
              ${SEGMENTS.map((segment) => `
                <button class="segment-button" type="button" data-segment="${segment.id}" aria-pressed="${day.seg[segment.id] ? "true" : "false"}" aria-label="${escapeHtml(segment.zh)} ${escapeHtml(segment.en)}：${escapeHtml(segment.desc)}">
                  <span class="box" aria-hidden="true"></span>
                  <span>
                    <span class="segment-title">${escapeHtml(segment.zh)}</span>
                  </span>
                  <span class="segment-code">${escapeHtml(segment.en)}</span>
                </button>
              `).join("")}
            </div>
          </div>
          <section class="ledger-panel analysis-panel" aria-labelledby="today-analysis-title">
            <div class="label">Daily Analysis</div>
            <h3 id="today-analysis-title">今日分析</h3>
            <p>小事 → 宏观 → 结构 → 判断 → 表达 → 共事。</p>
            ${renderAnalysisFields(day, "today", "data-today-analysis")}
          </section>
          <div class="field-grid">
            <div class="field">
              <label class="label" for="today-note">今日产出 / 补充</label>
              <textarea id="today-note" autocomplete="off">${escapeHtml(day.note)}</textarea>
            </div>
            <div class="field">
              <label class="label" for="today-reflection">一句反思</label>
              <textarea id="today-reflection" autocomplete="off">${escapeHtml(day.reflection)}</textarea>
            </div>
          </div>
          <div class="manual-save-row">
            <button class="button primary" type="button" data-save-today>保存到本机</button>
            <span class="save-status" id="today-save-status">${state.storageMode === "localStorage" ? "自动保存开启 · 本机浏览器" : "自动保存开启 · 内存临时存储"}</span>
          </div>
        `;
      }

      function renderWeek() {
        const currentWeek = currentWeekNumber();
        const selected = Math.max(1, state.selectedWeek || Math.max(1, currentWeek));
        const start = weekStart(selected);
        const plan = planForWeek(selected);
        const days = Array.from({ length: 7 }, (_, index) => addDays(start, index));
        const dayKeys = days.map((date) => dateToKey(date));
        const editKey = dayKeys.includes(state.weekEditDate) ? state.weekEditDate : null;
        if (state.weekEditDate && !editKey) state.weekEditDate = null;
        const qualifiedDays = days.reduce((sum, date) => sum + (isQualified(getDay(dateToKey(date))) ? 1 : 0), 0);
        const label = selected === currentWeek ? `第 ${selected} 周 · 当前周` : `第 ${selected} 周`;
        const review = plan ? plan.review : "计划周期外：沿用第 12 周复盘方式，整理下一季计划。";
        return `
          ${sectionHead(2, "本周", "七天训练账本与补录入口。", `<span>${escapeHtml(label)}</span><span>${escapeHtml(formatShortDate(start))} - ${escapeHtml(formatShortDate(addDays(start, 6)))}</span>`)}
          <div class="week-controls">
            <h3 class="week-title">${escapeHtml(label)}</h3>
            <div class="button-row">
              <button class="button" type="button" data-week-action="prev">上一周</button>
              <button class="button primary" type="button" data-week-action="current">当前周</button>
              <button class="button" type="button" data-week-action="next">下一周</button>
            </div>
          </div>
          <div class="metric-strip">
            <div class="metric">
              <span class="label">Qualified Days</span>
              <span class="metric-value">${qualifiedDays}/7</span>
            </div>
            <div class="metric">
              <span class="label">Review</span>
              <span class="metric-value" style="font-size:1.12rem;line-height:1.35">${escapeHtml(review)}</span>
            </div>
            <div class="metric">
              <span class="label">Theme</span>
              <span class="metric-value" style="font-size:1.12rem;line-height:1.35">${escapeHtml(plan ? plan.title : "计划周期外")}</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日期</th>
                  ${SEGMENTS.map((segment) => `<th>${escapeHtml(segment.zh)}</th>`).join("")}
                  <th>一句反思</th>
                </tr>
              </thead>
              <tbody>
                ${days.map((date) => {
                  const key = dateToKey(date);
                  const day = getDay(key);
                  const reflection = day.reflection.trim();
                  const shortReflection = reflection.length > 28 ? `${reflection.slice(0, 28)}...` : reflection;
                  const expanded = state.expandedReflections.has(key);
                  return `
                    <tr class="${key === dateToKey(today()) ? "today-row" : ""} ${key === editKey ? "editing-row" : ""}" data-week-date="${key}" tabindex="0" aria-label="编辑 ${key}">
                      <td><span class="smallcaps">${escapeHtml(formatShortDate(date))}</span><br><span class="muted">${escapeHtml(weekday(date))}</span></td>
                      ${SEGMENTS.map((segment) => `<td><span class="checkmark ${day.seg[segment.id] ? "done" : ""}" aria-label="${day.seg[segment.id] ? "已完成" : "未完成"}"></span></td>`).join("")}
                      <td class="reflection-cell ${expanded ? "expanded" : ""}">
                        <span>${escapeHtml(reflection ? (expanded ? reflection : shortReflection) : "—")}</span>
                        ${reflection.length > 28 ? `<button class="reflection-toggle" type="button" data-reflection-toggle="${key}" aria-expanded="${expanded ? "true" : "false"}">${expanded ? "收起" : "展开"}</button>` : ""}
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
          ${editKey ? renderWeekDayEditor(editKey) : `<div class="notice">点按某一天，可编辑那天的打卡、每日分析、今日产出与一句反思。</div>`}
        `;
      }

      function renderWeekDayEditor(key) {
        const date = keyToDate(key);
        const day = getDay(key);
        const count = completionCount(day);
        return `
          <section class="week-edit-panel" aria-labelledby="week-edit-title">
            <div>
              <div class="label">Edit Day</div>
              <h3 id="week-edit-title">${escapeHtml(formatDate(date))} · ${escapeHtml(weekday(date))}</h3>
              <p class="muted">编辑会立即保存到这一天的记录，并同步影响连续天数、达标率和热力图。</p>
            </div>
            <div class="metric-strip compact">
              <div class="metric">
                <span class="label">Completed</span>
                <span class="metric-value">${count}/6</span>
              </div>
              <div class="metric">
                <span class="label">Status</span>
                <span class="metric-value ${count >= 4 ? "good" : ""}">${count >= 4 ? "达标" : "未达标"}</span>
              </div>
            </div>
            <div class="week-edit-segments">
              ${SEGMENTS.map((segment) => `
                <button class="week-edit-segment" type="button" data-week-edit-segment="${segment.id}" data-week-edit-date="${key}" aria-pressed="${day.seg[segment.id] ? "true" : "false"}">
                  <span class="box" aria-hidden="true"></span>
                  <span>${escapeHtml(segment.zh)}</span>
                  <small>${escapeHtml(segment.en)}</small>
                </button>
              `).join("")}
            </div>
            <section class="analysis-panel" aria-labelledby="week-analysis-title">
              <div class="label">Daily Analysis</div>
              <h3 id="week-analysis-title">每日分析日志</h3>
              ${renderAnalysisFields(day, "week", `data-week-edit-analysis data-week-edit-date="${key}"`)}
            </section>
            <div class="field-grid">
              <div class="field">
                <label class="label" for="week-note">今日产出 / 补充</label>
                <textarea id="week-note" data-week-edit-field="note" data-week-edit-date="${key}" autocomplete="off">${escapeHtml(day.note)}</textarea>
              </div>
              <div class="field">
                <label class="label" for="week-reflection">一句反思</label>
                <textarea id="week-reflection" data-week-edit-field="reflection" data-week-edit-date="${key}" autocomplete="off">${escapeHtml(day.reflection)}</textarea>
              </div>
            </div>
          </section>
        `;
      }

      function renderPlan() {
        const current = currentWeekNumber();
        const highlighted = current > 12 ? 12 : current;
        const notice = current < 1
          ? `<div class="notice">计划尚未开始。当前日期早于第 1 周开始日期。</div>`
          : current > 12
            ? `<div class="notice">当前已在第 ${current} 周，12 周计划周期已完成。此处保留第 12 周作为最近有效周。</div>`
            : "";
        return `
          ${sectionHead(3, "计划", "完整 12 周训练目录。", `<span>Start ${escapeHtml(state.meta.start)}</span>`)}
          ${notice}
          ${PHASES.map((phase) => `
            <section class="phase-block">
              <h3 class="phase-title">${escapeHtml(phase)}</h3>
              ${WEEK_PLANS.filter((plan) => plan.phase === phase).map((plan) => `
                <article class="plan-week ${plan.week === highlighted ? "current" : ""}">
                  <div class="week-number">W${plan.week}</div>
                  <div>
                    <h4>${escapeHtml(plan.title)}</h4>
                    <dl class="definition-list">
                      <div><dt>目标</dt><dd>${escapeHtml(plan.goal)}</dd></div>
                      <div><dt>每日</dt><dd>${escapeHtml(plan.daily)}</dd></div>
                      <div><dt>复盘</dt><dd>${escapeHtml(plan.review)}</dd></div>
                    </dl>
                  </div>
                </article>
              `).join("")}
            </section>
          `).join("")}
        `;
      }

      function renderTemplates() {
        return `
          ${sectionHead(4, "模板", "六个可复制的训练骨架。")}
          <div class="ledger-list">
            ${TEMPLATES.map((template, index) => `
              <article class="template-item">
                <div class="template-head">
                  <h3>${escapeHtml(template.title)}</h3>
                  <div class="button-row">
                    ${index === 0 ? `<button class="button primary" type="button" data-use-analysis-template>用此模板填今天</button>` : ""}
                    <button class="button" type="button" data-copy-template="${index}">复制</button>
                  </div>
                </div>
                <pre class="template-body ${template.mode === "code" ? "code" : ""}" id="template-${index}">${escapeHtml(template.text)}</pre>
              </article>
            `).join("")}
          </div>
        `;
      }

      function heatAlpha(count) {
        if (count <= 0) return 0;
        return Math.min(0.82, 0.12 + count * 0.11).toFixed(2);
      }

      function renderProgress() {
        const stats = progressStats();
        const begin = startDate();
        const now = today();
        const windowStart = addDays(now, -83);
        const reflections = allDayKeys()
          .reverse()
          .map((key) => ({ key, day: getDay(key) }))
          .filter((entry) => entry.day.reflection.trim())
          .slice(0, 8);

        return `
          ${sectionHead(5, "进度", "最近十二周和整个周期的训练痕迹。", `<span>Start ${escapeHtml(state.meta.start)}</span>`)}
          ${state.flash ? `<div class="notice">${escapeHtml(state.flash)}</div>` : ""}
          <div class="stats-grid">
            <div class="metric">
              <span class="label">Qualified</span>
              <span class="metric-value">${stats.qualified}</span>
            </div>
            <div class="metric">
              <span class="label">Current</span>
              <span class="metric-value">${stats.current}</span>
            </div>
            <div class="metric">
              <span class="label">Longest</span>
              <span class="metric-value">${stats.longest}</span>
            </div>
            <div class="metric">
              <span class="label">${stats.startedDays} Days Rate</span>
              <span class="metric-value">${stats.rate}%</span>
            </div>
          </div>
          <section class="progress-grid">
            <div>
              <div class="label">Recent 12 Weeks</div>
              <div class="heatmap-shell" aria-label="最近 12 周热力图">
                <div class="heatmap">
                  ${Array.from({ length: 12 }, (_, column) => `
                    <div class="heat-week">
                      ${Array.from({ length: 7 }, (_, row) => {
                        const date = addDays(windowStart, column * 7 + row);
                        const key = dateToKey(date);
                        const count = completionCount(getDay(key));
                        const beforeStart = diffDays(begin, date) < 0;
                        return `<span class="heat-cell ${key === dateToKey(now) ? "today" : ""} ${beforeStart ? "before-start" : ""}" style="--heat:${heatAlpha(count)}" title="${escapeHtml(key)} · 完成 ${count}/6"></span>`;
                      }).join("")}
                    </div>
                  `).join("")}
                </div>
              </div>
              <div class="heat-legend" aria-label="热力图图例">
                <span>少</span>
                ${[0, 1, 2, 3, 4, 5, 6].map((count) => `<span class="legend-swatch" style="--heat:${heatAlpha(count)}" aria-label="完成 ${count}/6"></span>`).join("")}
                <span>多</span>
              </div>
            </div>
            <div>
              <div class="label">Recent Reflections</div>
              <ul class="reflection-list">
                ${reflections.length ? reflections.map((entry) => `
                  <li>
                    <span class="reflection-date">${escapeHtml(entry.key)}</span>
                    <span>${escapeHtml(entry.day.reflection)}</span>
                  </li>
                `).join("") : `<li><span class="reflection-date">—</span><span class="muted">暂无反思记录</span></li>`}
              </ul>
            </div>
            <section class="settings-panel">
              <h3>设置</h3>
              <div class="settings-grid">
                <div>
                  <label class="label" for="start-date">第 1 周开始日期</label>
                  <input id="start-date" type="date" value="${escapeHtml(state.meta.start)}">
                </div>
                <div class="button-row">
                  <button class="button" type="button" data-progress-action="export">导出 JSON</button>
                  <button class="button" type="button" data-progress-action="import">导入 JSON</button>
                  <button class="button danger" type="button" data-progress-action="clear">${state.clearArmed ? "再次确认清空" : "清空全部"}</button>
                  <input class="visually-hidden" id="import-file" type="file" accept="application/json,.json">
                </div>
              </div>
            </section>
          </section>
        `;
      }

      function archiveEntries() {
        return allDayKeys()
          .reverse()
          .map((key) => {
            const date = keyToDate(key);
            const day = getDay(key);
            return { key, date, day, week: currentWeekNumber(date) };
          })
          .filter((entry) => hasAnalysis(entry.day));
      }

      function archiveWeekOptions(entries) {
        return Array.from(new Set(entries.map((entry) => entry.week)))
          .sort((a, b) => b - a)
          .map((week) => `
            <option value="${week}" ${String(week) === state.archiveWeek ? "selected" : ""}>

      function bindTodayEvents() {
        const key = dateToKey(today());

        const updateSaveStatus = (mode) => {
          if (!saveStatus) return;
          const time = new Intl.DateTimeFormat("zh-CN", {

            second: "2-digit"
          }).format(new Date());
          const storageText = state.storageMode === "localStorage" ? "本机浏览器" : "内存临时存储";
          saveStatus.textContent = `${mode} · ${storageText} · ${time}`;
        };
        const saveTodayForm = (mode = "已保存") => {
          const day = getDay(key);

            day.analysis[field.dataset.analysisField] = field.value;

        document.querySelectorAll("[data-today-analysis]").forEach((field) => {
          field.addEventListener("input", () => {
            saveTodayForm("已自动保存");
          });

        });
        reflection.addEventListener("input", () => {
          saveTodayForm("已自动保存");
        });
        document.querySelector("[data-save-today]").addEventListener("click", () => {

          state.focusTodayAnalysis = false;
          window.requestAnimationFrame(() => {
