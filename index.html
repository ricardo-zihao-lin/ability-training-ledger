      function fallbackCopy(text, element) {
        try {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.setAttribute("readonly", "");
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(helper);
          return ok;
        } catch (error) {
          const range = document.createRange();
          range.selectNodeContents(element);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          return false;
        }
      }

      function bindTemplateEvents() {
        document.querySelectorAll("[data-use-analysis-template]").forEach((button) => {
          button.addEventListener("click", () => {
            state.focusTodayAnalysis = true;
            if (window.location.hash === "#today") {
              render();
            } else {
              window.location.hash = "today";
            }
          });
        });
        document.querySelectorAll("[data-copy-template]").forEach((button) => {
          button.addEventListener("click", async () => {
            const index = Number(button.dataset.copyTemplate);
            const template = TEMPLATES[index];
            const element = document.getElementById(`template-${index}`);
            let copied = false;
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(template.text);
                copied = true;
              }
            } catch (error) {
              copied = false;
            }
            if (!copied) copied = fallbackCopy(template.text, element);
            if (copied) {
              const previous = button.textContent;
              button.textContent = "已复制";
              window.setTimeout(() => {
                button.textContent = previous;
              }, 1400);
            }
          });
        });
      }

      function exportData() {
        const payload = {
          version: 2,
          exportedAt: new Date().toISOString(),
          meta: state.meta,
          days: {},
          weekHabits: {},
          onceHabits: getOnceHabits()
        };
        allDayKeys().forEach((key) => {
          payload.days[key] = getDay(key);
        });
        allWeekHabitKeys().forEach((week) => {
          payload.weekHabits[week] = getWeekHabits(Number(week));
        });
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `ability-trainer-${dateToKey(today())}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function importData(payload) {
        if (!payload || typeof payload !== "object") {
          throw new Error("Invalid JSON");
        }
        let imported = 0;
        if (payload.meta && typeof payload.meta === "object") {
          const nextMeta = { ...state.meta };
          if (keyToDate(payload.meta.start)) nextMeta.start = payload.meta.start;
          if (payload.meta.computerTrack === "portfolio" || payload.meta.computerTrack === "interview") {
            nextMeta.computerTrack = payload.meta.computerTrack;
          }
          saveMeta(nextMeta);
        }

        const dayEntries = [];
        if (payload.days && typeof payload.days === "object") {
          Object.entries(payload.days).forEach(([key, value]) => {
            if (keyToDate(key)) dayEntries.push([key, value]);
          });
        }
        Object.entries(payload).forEach(([key, value]) => {
          if (key.startsWith(DAY_PREFIX)) {
            const dateKey = key.slice(DAY_PREFIX.length);
            if (keyToDate(dateKey)) dayEntries.push([dateKey, value]);
          }
        });

        dayEntries.forEach(([key, value]) => {
          saveDay(key, normalizeDay(value));
          imported += 1;
        });

        let importedWeekHabits = 0;
        if (payload.weekHabits && typeof payload.weekHabits === "object") {
          Object.entries(payload.weekHabits).forEach(([week, value]) => {
            if (/^-?\d+$/.test(week)) {
              saveWeekHabits(Number(week), value);
              importedWeekHabits += 1;
            }
          });
        }
        Object.entries(payload).forEach(([key, value]) => {
          if (key.startsWith(WEEK_HABITS_PREFIX)) {
            const week = key.slice(WEEK_HABITS_PREFIX.length);
            if (/^-?\d+$/.test(week)) {
              saveWeekHabits(Number(week), value);
              importedWeekHabits += 1;
            }
          }
        });

        if (payload.onceHabits && typeof payload.onceHabits === "object") {
          const current = getOnceHabits();
          saveOnceHabits({ ...current, ...normalizeOnceHabits(payload.onceHabits) });
        }
        if (payload[ONCE_HABITS_KEY] && typeof payload[ONCE_HABITS_KEY] === "object") {
          const current = getOnceHabits();
          saveOnceHabits({ ...current, ...normalizeOnceHabits(payload[ONCE_HABITS_KEY]) });
        }
        state.meta = loadMeta();
        state.selectedWeek = Math.max(1, currentWeekNumber());
        setFlash(`已按天合并导入 ${imported} 天记录，${importedWeekHabits} 周习惯记录。`);
        render();
      }

      function clearAllData() {
        listStorageKeys().forEach((key) => {
          if (key === META_KEY || key === ONCE_HABITS_KEY || key.startsWith(DAY_PREFIX) || key.startsWith(WEEK_HABITS_PREFIX)) removeRaw(key);
        });
        Object.keys(memoryStore).forEach((key) => {
          if (key === META_KEY || key === ONCE_HABITS_KEY || key.startsWith(DAY_PREFIX) || key.startsWith(WEEK_HABITS_PREFIX)) delete memoryStore[key];
        });
        state.meta = loadMeta();
        state.selectedWeek = Math.max(1, currentWeekNumber());
        state.clearArmed = false;
        state.expandedArchive.clear();
        state.expandedReflections.clear();
        setFlash("已清空本应用数据，并把开始日期重设为今天。");
        render();
      }

      function bindProgressEvents() {
        const startInput = document.getElementById("start-date");
        startInput.addEventListener("change", () => {
          if (!keyToDate(startInput.value)) return;
          state.meta = { ...state.meta, start: startInput.value };
          saveMeta(state.meta);
          state.selectedWeek = Math.max(1, currentWeekNumber());
          render();
        });

        const importFile = document.getElementById("import-file");
        importFile.addEventListener("change", () => {
          const file = importFile.files && importFile.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            try {
              importData(JSON.parse(String(reader.result || "{}")));
            } catch (error) {
              setFlash("导入失败：JSON 格式或数据结构不正确。");
              render();
            }
          });
          reader.readAsText(file);
        });

        document.querySelectorAll("[data-progress-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.progressAction;
            if (action === "export") exportData();
            if (action === "import") importFile.click();
            if (action === "clear") {
              if (!state.clearArmed) {
                state.clearArmed = true;
                window.clearTimeout(state.clearTimer);
                state.clearTimer = window.setTimeout(() => {
                  state.clearArmed = false;
                  if (state.route === "progress") render();
                }, 5200);
                render();
              } else {
                clearAllData();
              }
            }
          });
        });
      }

      function init() {
        state.meta = loadMeta();
        state.selectedWeek = Math.max(1, currentWeekNumber());
        window.addEventListener("hashchange", render);
        if (!window.location.hash) {
          window.location.hash = "schedule";
        }
        render();
        document.getElementById("loading").hidden = true;
        document.getElementById("app").hidden = false;
      }

      init();
    })();
  </script>
</body>
</html>
